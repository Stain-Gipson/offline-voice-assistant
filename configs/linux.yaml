# Linux / Windows with an NVIDIA GPU: Parakeet TDT STT, Qwen3.5-4B (Transformers) LLM, Kokoro-82M TTS.
# Needs: pip install "speech-to-speech[kokoro]"
# Run: speech-to-speech serve -f configs/linux.yaml
schema_version: 1
blocks:
  vad: {kind: vad, backend: silero}
  stt: {kind: stt, backend: parakeet-tdt}
  llm:
    kind: llm
    backend: transformers
    settings:
      model_name: Qwen/Qwen3.5-4B
  tts: {kind: tts, backend: kokoro}
pipelines:
  linux:
    stages: {vad: vad, stt: stt, llm: llm, tts: tts}
